<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎭 Joke Generator - Make Me Laugh! 😂</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <div class="hero-emoji">😂</div>
            <h1>🎭 Joke Generator 🎭</h1>
            <p class="subtitle">Get your daily dose of laughter! 😆</p>
        </header>

        {% block content %}{% endblock %}

        <div class="button-group">
            <a href="/" style="text-decoration: none; flex: 1; display: flex;">
                <button style="width: 100%;">😂 Get One Joke!</button>
            </a>
            <a href="/many-jokes?count=5" style="text-decoration: none; flex: 1; display: flex;">
                <button style="width: 100%;">🤣 Get 5 Jokes!</button>
            </a>
        </div>

        <footer>
            <p>Made with ❤️ and lots of laughter 😆 — Powered by Joke API</p>
        </footer>
    </div>
</body>
</html>
